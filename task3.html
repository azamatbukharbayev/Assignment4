<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café Table Reservation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/task3.css">
</head>
<body>
    <main class="container py-4 py-md-5">
        <div class="reservation-card mx-auto">
            <div class="reservation-header">
                <h1 class="reservation-title">Reserve a table</h1>
            </div>
            <div class="reservation-body">
                <form action="#" method="post">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="name" class="form-label">Your name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" name="name" required autocomplete="name" placeholder="John Doe">
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="email" name="email" required autocomplete="email" placeholder="john@example.com">
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="phone" class="form-label">Phone <span class="text-danger">*</span></label>
                            <input type="tel" class="form-control" id="phone" name="phone" required autocomplete="tel" placeholder="+7 701 234 56 78">
                        </div>
                        <div class="col-md-6">
                            <label for="guests" class="form-label">Guests <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="guests" name="guests" required min="1" max="20" value="2">
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="date" class="form-label">Date <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="date" name="date" required>
                        </div>
                        <div class="col-md-6">
                            <label for="meal" class="form-label">Meal <span class="text-danger">*</span></label>
                            <select class="form-select" id="meal" name="meal">
                                <option value="lunch" selected>Lunch</option>
                                <option value="dinner">Dinner</option>
                            </select>
                        </div>
                    </div>

                    <fieldset class="mb-3">
                        <legend class="form-label">Seating <span class="text-danger">*</span></legend>
                        <div class="d-flex gap-4 flex-wrap">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="seating" id="seatingInside" value="inside" checked required>
                                <label class="form-check-label" for="seatingInside">Inside</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="seating" id="seatingTerrace" value="terrace" required>
                                <label class="form-check-label" for="seatingTerrace">Terrace</label>
                            </div>
                        </div>
                    </fieldset>

                    <div class="mb-3">
                        <label for="comments" class="form-label">Comments</label>
                        <textarea class="form-control" id="comments" name="comments" rows="3" placeholder="Special requests, dietary restrictions, or table preference"></textarea>
                    </div>

                    <div class="mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="terms" name="terms" value="agreed" required>
                            <label class="form-check-label" for="terms">I agree to the terms <span class="text-danger">*</span></label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-reserve w-100">Reserve</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
