<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Train Ticket</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/task1.css">
</head>
<body>
    <main class="container py-4 py-md-5">
        <div class="ticket-card mx-auto">
            <div class="ticket-header">
                <h1 class="ticket-title">Book a train ticket</h1>
            </div>
            <div class="ticket-body">
                <form action="#" method="post">
                    <div class="mb-4">
                        <div class="btn-group trip-toggle-group" role="group" aria-label="Trip type">
                            <input type="radio" class="btn-check" name="trip_type" id="oneWay" value="one_way" checked>
                            <label class="btn btn-trip" for="oneWay">One way</label>
                            <input type="radio" class="btn-check" name="trip_type" id="roundTrip" value="round_trip">
                            <label class="btn btn-trip" for="roundTrip">Round trip</label>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="fromCity" name="from" placeholder="Astana" value="Astana" required>
                                <label for="fromCity">From</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="toCity" name="to" placeholder="Almaty" value="Almaty" required>
                                <label for="toCity">To</label>
                            </div>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label for="departure" class="form-label">Departure</label>
                            <input type="date" class="form-control" id="departure" name="departure" required>
                        </div>
                        <div class="col-md-4">
                            <label for="returnDate" class="form-label">Return</label>
                            <input type="date" class="form-control" id="returnDate" name="return">
                        </div>
                        <div class="col-md-4">
                            <label for="passengers" class="form-label">Passengers</label>
                            <select class="form-select" id="passengers" name="passengers">
                                <option value="1" selected>1 adult</option>
                                <option value="2">2 adults</option>
                                <option value="3">3 adults</option>
                                <option value="4">4 adults</option>
                                <option value="5">5 adults</option>
                                <option value="6">6 adults</option>
                            </select>
                        </div>
                    </div>

                    <fieldset class="mb-3">
                        <legend class="form-label">Carriage class</legend>
                        <div class="d-flex gap-4 flex-wrap">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="carriage_class" id="seat" value="seat" required>
                                <label class="form-check-label" for="seat">Seat</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="carriage_class" id="coupe" value="coupe" checked required>
                                <label class="form-check-label" for="coupe">Coupé</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="carriage_class" id="sleeper" value="sleeper" required>
                                <label class="form-check-label" for="sleeper">Sleeper</label>
                            </div>
                        </div>
                    </fieldset>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="phone" class="form-label">Phone</label>
                            <div class="input-group">
                                <span class="input-group-text phone-prefix">+7</span>
                                <input type="tel" class="form-control" id="phone" name="phone" placeholder="701 234 56 78" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" role="switch" id="smsNotify" name="sms_notify" value="yes">
                            <label class="form-check-label" for="smsNotify">Also send the ticket by SMS</label>
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="agreement" name="agreement" value="yes" required>
                            <label class="form-check-label" for="agreement">I agree with the carriage rules</label>
                        </div>
                    </div>

                    <div class="ticket-actions d-flex gap-3 justify-content-end">
                        <button type="reset" class="btn btn-clear">Clear</button>
                        <button type="submit" class="btn btn-find">Find trains</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
